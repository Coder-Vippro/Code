<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    li:first-child {
        color: red;
    }
    li:last-child {
        color: blue;
    }
    p:nth-child(2) {
        color: green;
    }
    li:nth-child(2n+1) {
        font-weight: bold;
    }
    li:nth-of-type(3) {
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <ul>
        <li>Item 1</li>
        <p>Item 2</p>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    
    </ul>

</body>
</html>
